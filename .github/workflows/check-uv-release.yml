name: Check for new uv release

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: check-uv-release
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Dispatch bottle build for a new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_tag="$(sed -n 's|.*refs/tags/\([^/]*\)\.tar\.gz.*|\1|p' Formula/uv.rb)"
          latest_tag="$(gh api repos/astral-sh/uv/releases/latest --jq '.tag_name')"

          if [[ -z "$current_tag" || -z "$latest_tag" ]]; then
            echo "::error::Could not determine current or latest uv release"
            exit 1
          fi

          current_version="${current_tag#v}"
          latest_version="${latest_tag#v}"
          if [[ "$current_version" == "$latest_version" ]]; then
            echo "uv ${current_version} is already current"
            exit 0
          fi

          gh workflow run dispatch-build-bottle.yml \
            --ref "$GITHUB_REF_NAME" \
            --field release="$latest_tag"
