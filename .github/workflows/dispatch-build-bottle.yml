name: Build and publish bottles

run-name: Build uv ${{ inputs.release || 'formula version' }} bottles

on:
  workflow_dispatch:
    inputs:
      release:
        description: uv release tag to build (empty uses the formula's current version)
        required: false
      runners:
        description: JSON array of GitHub-hosted runners to build on
        required: true
        default: '["macos-26","ubuntu-latest"]'
      timeout:
        description: Build timeout per runner, in minutes
        type: number
        required: false
        default: 60

env:
  FORMULA: uv
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_GITHUB_ACTIONS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_BUILD_ERROR_ISSUES: 1

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: bottle-uv
  cancel-in-progress: false

permissions: {}

jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      url: ${{ steps.source.outputs.url }}
      sha256: ${{ steps.source.outputs.sha256 }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      root_url: ${{ steps.source.outputs.root_url }}
    steps:
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check release storage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          immutable="$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled')"
          if [[ "$immutable" == true ]]; then
            echo "::error::Immutable releases must be disabled to overwrite bottle assets"
            exit 1
          fi

      - name: Resolve requested uv release
        id: source
        env:
          REQUESTED_RELEASE: ${{ inputs.release }}
        run: |
          tag="$REQUESTED_RELEASE"
          if [[ -z "$tag" ]]; then
            tag="$(sed -n 's|.*refs/tags/\([^/]*\)\.tar\.gz.*|\1|p' Formula/uv.rb)"
          fi
          if [[ -z "$tag" ]]; then
            echo "::error::Could not determine the uv release tag"
            exit 1
          fi

          version="${tag#v}"
          url="https://github.com/astral-sh/uv/archive/refs/tags/${tag}.tar.gz"
          release_tag="bottles-${version}"
          root_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}"
          archive="$(mktemp)"
          curl --fail --location --silent --show-error "$url" --output "$archive"
          sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"

          {
            echo "version=$version"
            echo "url=$url"
            echo "sha256=$sha256"
            echo "release_tag=$release_tag"
            echo "root_url=$root_url"
          } >> "$GITHUB_OUTPUT"

  bottle:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ fromJSON(inputs.timeout) }}
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.runner }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.runner }}-rubygems-

      - name: Target requested uv release
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA256: ${{ needs.source.outputs.sha256 }}
          RELEASE_URL: ${{ needs.source.outputs.url }}
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
          ROOT_URL: ${{ needs.source.outputs.root_url }}
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          tap_name="${repository_name#homebrew-}"
          tap_formula="${GITHUB_REPOSITORY_OWNER}/${tap_name}/${FORMULA}"
          current_version="$(brew info --json=v2 "$tap_formula" | jq -r '.formulae[0].versions.stable')"
          if [[ "$current_version" == "$RELEASE_VERSION" ]]; then
            formula_path="$(brew --repo "${GITHUB_REPOSITORY_OWNER}/${tap_name}")/Formula/${FORMULA}.rb"
            FORMULA_PATH="$formula_path" ROOT_URL="$ROOT_URL" ruby -e '
              path = ENV.fetch("FORMULA_PATH")
              contents = File.read(path)
              bottle_block = contents[/^  bottle do\n.*?^  end\n/m]
              abort "Could not find bottle block in #{path}" unless bottle_block
              rebuild = bottle_block[/^    rebuild (\d+)$/, 1].to_i
              replacement = "  bottle do\n    root_url #{ENV.fetch("ROOT_URL").inspect}\n"
              replacement << "    rebuild #{rebuild}\n" if rebuild.positive?
              replacement << "  end\n"
              contents.sub!(bottle_block, replacement)
              File.write(path, contents)
            '
            echo "KEEP_OLD_REBUILD=1" >> "$GITHUB_ENV"
          else
            brew bump-formula-pr \
              --write-only \
              --no-audit \
              --url="$RELEASE_URL" \
              --sha256="$RELEASE_SHA256" \
              "$tap_formula"
          fi

      - name: Build and test bottle
        env:
          ROOT_URL: ${{ needs.source.outputs.root_url }}
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          tap_name="${repository_name#homebrew-}"
          tap_formula="${GITHUB_REPOSITORY_OWNER}/${tap_name}/${FORMULA}"
          test_bot_args=(
            --only-formulae
            --skip-dependents
            --skip-online-checks
            --root-url="$ROOT_URL"
          )
          if [[ "${KEEP_OLD_REBUILD:-}" == 1 ]]; then
            test_bot_args+=(--keep-old)
          fi

          brew test-bot --only-cleanup-before
          brew test-bot --only-setup
          brew test-bot "${test_bot_args[@]}" "$tap_formula"

      - name: Upload bottle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.runner }}
          path: '*.bottle.*'
          if-no-files-found: error

  publish:
    needs: [source, bottle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BOTTLES_DIR: ${{ github.workspace }}/bottles
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download bottles
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7.0.0
        with:
          pattern: bottles_*
          path: ${{ env.BOTTLES_DIR }}
          merge-multiple: true

      - name: Configure Git user
        uses: Homebrew/actions/git-user-config@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1

      - name: Target requested uv release
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA256: ${{ needs.source.outputs.sha256 }}
          RELEASE_URL: ${{ needs.source.outputs.url }}
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          tap_name="${repository_name#homebrew-}"
          tap_formula="${GITHUB_REPOSITORY_OWNER}/${tap_name}/${FORMULA}"
          current_version="$(brew info --json=v2 "$tap_formula" | jq -r '.formulae[0].versions.stable')"
          if [[ "$current_version" != "$RELEASE_VERSION" ]]; then
            brew bump-formula-pr \
              --write-only \
              --no-audit \
              --url="$RELEASE_URL" \
              --sha256="$RELEASE_SHA256" \
              "$tap_formula"
          fi

      - name: Remove existing bottle assets
        env:
          RELEASE_TAG: ${{ needs.source.outputs.release_tag }}
        run: |
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id' 2>/dev/null || true)"
          if [[ -n "$release_id" ]]; then
            while IFS= read -r asset_id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[].id')
          fi

      - name: Upload bottles and update formula metadata
        working-directory: ${{ env.BOTTLES_DIR }}
        env:
          ROOT_URL: ${{ needs.source.outputs.root_url }}
        run: |
          brew pr-upload --verbose --root-url="$ROOT_URL"

      - name: Verify public bottle downloads
        env:
          ROOT_URL: ${{ needs.source.outputs.root_url }}
        run: |
          for bottle in "$BOTTLES_DIR"/*.bottle.tar.gz; do
            curl \
              --fail \
              --head \
              --location \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 2 \
              --silent \
              --show-error \
              --output /dev/null \
              "$ROOT_URL/$(basename "$bottle")"
          done

      - name: Push bottle commit
        uses: Homebrew/actions/git-try-push@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
          branch: ${{ github.ref_name }}
